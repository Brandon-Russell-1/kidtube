# ─────────────────────────────────────────────────────────────────────────────
# KidTube parent controls
#
# This is the only file you need to edit. Changes take effect on the next
# screening run (nightly, or run it by hand: Actions tab → "Screen videos" →
# "Run workflow").
#
# YAML tips: keep the indentation, use spaces not tabs, and put quotes around
# anything that starts with @.
# ─────────────────────────────────────────────────────────────────────────────

# Your child's age. The AI judges every video against this.
child_age: 6

# Your local timezone, so "today's lineup" rolls over at your midnight rather
# than UTC's. Use a name from https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone: America/Chicago

# What you want more of. A higher number means it shows up more often in the
# daily lineup (3 = lots, 1 = a little).
topics_wanted:
  science: 3
  reading: 3
  math: 2
  animals: 2
  art: 1

# Never approve videos that are mainly about these.
topics_banned:
  - toy unboxing
  - gaming
  - pranks
  - scary content
  - challenge videos

# The main source of videos. The job reads each channel's recent uploads, which
# costs almost no YouTube API quota. Use a handle ("@SciShowKids"), a channel ID
# ("UC..."), or a channel URL. A handle that can't be found is skipped with a
# warning in the run log; it never fails the run.
#
# Handles can be given up and then claimed by copycats, so a handle that points
# at a channel with fewer than 10,000 subscribers is skipped with a warning.
# To trust a small channel, list it by its channel ID instead.
trusted_channels:
  # Science, nature, and how things work
  - "@SciShowKids"
  - "@natgeokids"
  - "@MysterySci"            # Mystery Science
  - "@crashcoursekids"       # Crash Course Kids
  - "@ScienceMax"            # Science Max: hands-on experiments
  - "@GenerationGenius"      # Generation Genius
  - "@Peekaboo_Kidz"         # The Dr. Binocs Show
  - "@maddiemoate"           # Maddie Moate: how things are made, factory visits
  - "@WildKratts"            # Wild Kratts
  - "@BBCEarthKids"          # BBC Earth Kids: animals
  - "@AndysAmazingAdventures"  # Andy's Dinosaur Adventures and more
  - "@TheMagicSchoolBusOfficial"  # The Magic School Bus
  - "@Octonauts"             # Octonauts: ocean animals
  - "@CuriousGeorge"         # Curious George
  - "@klt"                   # Kids Learning Tube: space and animal songs
  - "@HappyLearningENG"      # Happy Learning English: science explainers
  # Reading, math, and general learning
  - "@Numberblocks"
  - "@officialalphablocks"
  - "@FreeSchool"
  - "@HomeschoolPop"
  - "@PBSKIDS"
  - "@SmileandLearnEnglish"  # Smile and Learn
  - "@ScratchGarden"         # Scratch Garden
  - "@LearnBright"           # Learn Bright
  - "@mathantics"            # Math Antics (best for ages 7-8)
  - "@NUMBEROCKLLC"          # Numberock: math songs
  - "@rocknlearn"            # Rock 'N Learn: phonics and math
  - "@JackHartmann"          # Jack Hartmann: learning songs
  # Stories and drawing
  - "@StorylineOnline"
  - "@BrightlyStorytime"     # Brightly Storytime: read-alouds
  - "@KidTimeStoryTime"      # KidTime StoryTime: read-alouds
  - "@ArtforKidsHub"
  # Shows he likes. Mostly entertainment, so few of these pass
  # min_educational_score: 7.
  - "@disneyjr"              # Disney Jr. (the old "@disneyjunior" handle now belongs to a copycat)
  - "@disneykids"
  - "@marvelhq"
  - "@starwarskids"
  - "@BlueyOfficialChannel"  # Bluey
  - "@PAWPatrolOfficial"     # PAW Patrol
  - "@NetflixJr"             # StoryBots, Ada Twist Scientist, Octonauts

# Never show anything from these channels, even if a search finds them.
# Same formats as trusted_channels. Already-approved videos from a channel you
# add here are removed on the next run.
blocked_channels: []

# Extra discovery through YouTube search, from channels you haven't listed.
# Search is expensive on API quota, so the job runs one of these per night,
# rotating through the list, and gives its results up to a fifth of that night's
# screening. Search results still go through every filter, and the AI holds
# them to a stricter standard than videos from trusted channels.
search_terms:
  - science experiments for kids
  - read aloud picture books for kids
  - how do animals live for kids
  - how things are made for kids
  - how machines work for kids
  - simple machines for kids
  - engineering for kids
  - solar system and planets for kids
  - astronauts and space travel for kids
  - dinosaur facts for kids
  - ocean animals for kids
  - weather and seasons for kids
  - human body for kids
  - countries of the world for kids
  - first grade math lesson
  - second grade math lesson
  - phonics read along first grade
  - draw along for kids

# Video length limits, in minutes. The 3-minute floor also keeps YouTube Shorts
# out (Shorts can be up to 3 minutes long).
min_video_minutes: 3
max_video_minutes: 60

# How many videos he gets each day.
daily_lineup_count: 50

# Don't show the same video again within this many days. If the approved pool
# is too small to fill a day without repeating, the least-recently-shown videos
# fill the gap rather than leaving him with a short lineup.
repeat_after_days: 14

# The AI scores each video 1-10 for educational value. Only videos at or above
# this score are approved.
min_educational_score: 7

# How many new videos the AI screens per run. More means the approved pool
# grows faster. Each video costs about a twentieth of a cent to screen (the run
# summary shows the actual cost). Most nights only a few new uploads appear,
# so the real number is usually far lower. Maximum 500.
max_videos_screened_per_run: 150

# Total watch time allowed per day on the kid site, in minutes. 0 = no limit.
daily_watch_limit_minutes: 0

# PIN for the hidden parent page (long-press the top-right corner of the site).
# Digits only. This repo is public, so this is a speed bump, not security.
parent_pin: "2468"

# Anything else the AI should know, in plain English. This paragraph goes
# straight into the AI's instructions.
free_text_guidance: >
  He loves space, dinosaurs, paw patrol, bluey, spiderman, and how machines work. Calm, clearly narrated
  videos are best. Avoid videos with frantic editing, shouting hosts, or
  constant sound effects. No videos that are mostly an advertisement for a toy
  or product. Gentle, kind humor is fine; mean-spirited or gross-out humor is
  not.

name: Tests

on:
  push:
    paths:
      - "screener/**"
      - "tests/**"
      - "requirements.txt"
      - "rules.yaml"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Check rules.yaml is valid
        run: python -c "from screener import config; from screener.rules import load_rules; load_rules(config.RULES_PATH); print('rules.yaml OK')"
